services:
  - type: web
    name: ine-price-tracker
    env: node
    # buildCommand runs on EVERY deploy, bypassing Render's node_modules cache.
    # This guarantees the Playwright Chromium binary is always present.
    buildCommand: npm install && npx playwright install chromium
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
